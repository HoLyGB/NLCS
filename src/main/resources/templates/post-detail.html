<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">Chi tiết sản phẩm</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .product-img { width: 100%; height: 400px; object-fit: cover; border-radius: 10px; }
        .navbar-chonhanh { background-color: #0d6efd; }
    </style>
</head>
<body class="bg-light">

<div th:replace="navbar :: myNavbar"></div>

<div class="container my-5">
    <div class="row">
        <!-- Cột trái: Hình ảnh -->
        <div class="col-md-6">
            <div id="productCarousel" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div th:each="img, iter : ${post.images}" th:classappend="${iter.index == 0} ? 'carousel-item active' : 'carousel-item'">
                        <img th:src="${img.imageUrl}" class="product-img" alt="Ảnh sản phẩm">
                    </div>
                </div>
            </div>
        </div>

        <!-- Cột phải: Thông tin -->
        <div class="col-md-6">
            <h2 class="fw-bold" th:text="${post.title}">Tiêu đề sản phẩm</h2>
            <h3 class="text-danger fw-bold my-3" th:text="${#numbers.formatDecimal(post.price, 0, 'POINT', 0, 'POINT')} + ' đ'">Giá</h3>
            
            <p class="text-muted"><i class="fas fa-map-marker-alt"></i> Khu vực: <span th:text="${post.province}"></span></p>

            <!-- NÚT LIÊN HỆ (Kết nối tới Chat) -->
           <!-- Chỉ hiện nút liên hệ khi người xem KHÁC chủ bài đăng -->
<div th:if="${session.loggedInUser != null and session.loggedInUser.id != post.sellerId}">
 <!-- Bấm vào đây sẽ gọi hàm JS mở khung chat popup thay vì chuyển trang -->
<button type="button" th:onclick="'openChat(' + ${post.id} + ')'" class="btn btn-primary btn-lg w-100 py-3 mb-3">
    <i class="fas fa-comments me-2"></i> Liên hệ người bán
</button>
</div>

<!-- Nếu là chính chủ xem bài của mình thì hiện thông báo hoặc nút Sửa/Xóa -->
<div th:if="${session.loggedInUser != null and session.loggedInUser.id == post.sellerId}">
    <div class="alert alert-warning text-center">Đây là bài đăng của bạn</div>
    <a th:href="@{'/user/post/edit/' + ${post.id}}" class="btn btn-warning w-100 py-2">Chỉnh sửa tin này</a>
</div>

            <!-- Thông số kỹ thuật -->
            <div class="card p-3 mt-4">
                <h5 class="fw-bold"><i class="fas fa-info-circle me-2"></i> Thông số</h5>
                <table class="table table-sm mt-2">
                    <tr th:each="entry : ${post.attributes}">
                        <th th:text="${entry.key}">Thuộc tính</th>
                        <td th:text="${entry.value}">Giá trị</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>

    <!-- Mô tả chi tiết -->
    <div class="row mt-5">
        <div class="col-12">
            <div class="card p-4 shadow-sm">
                <h5 class="fw-bold mb-3">Mô tả sản phẩm</h5>
                <p th:text="${post.description}" style="white-space: pre-line;"></p>
            </div>
        </div>
    </div>
</div>
<!-- KHUNG CHAT NỔI (Góc dưới bên phải) -->
<div id="chatWidget" class="card shadow-lg" style="display: none; position: fixed; bottom: 20px; right: 20px; width: 350px; z-index: 1050; border-radius: 12px; overflow: hidden;">
    <!-- Header hộp chat -->
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center py-2">
        <h6 class="mb-0 fw-bold"><i class="fas fa-comment-dots me-2"></i> Trò chuyện với người bán</h6>
        <button type="button" class="btn-close btn-close-white" onclick="closeChat()"></button>
    </div>
    
    <!-- Nội dung tin nhắn -->
    <div class="card-body chat-messages-box" id="chatMessages" style="height: 300px; overflow-y: auto; background: #f8f9fa; padding: 15px;">
        <!-- Tin nhắn sẽ được load tự động bằng JS vào đây -->
    </div>

    <!-- Form nhập tin nhắn -->
    <div class="card-footer bg-white p-2">
        <form id="chatForm" onsubmit="sendChatMessage(event)" class="d-flex">
            <input type="hidden" id="activeConversationId">
            <input type="text" id="chatInput" class="form-control form-control-sm me-2" placeholder="Nhập tin nhắn..." required autocomplete="off">
            <button type="submit" class="btn btn-primary btn-sm"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>
</div>

<!-- SCRIPT XỬ LÝ AJAX -->
<!-- BẮT BUỘC PHẢI CÓ th:inline="javascript" ĐỂ THYMELEAF HIỂU VÀ ĐỔI DỮ LIỆU -->
<script th:inline="javascript">
    let currentConvId = null;
    
    // Biến lấy ID từ Session của Spring Boot
    const currentUserId = /*[[${session.loggedInUser != null ? session.loggedInUser.id : 0}]]*/ 0;

    // 1. Mở khung chat khi bấm nút liên hệ
    function openChat(postId) {
        if (currentUserId === 0) {
            alert('Vui lòng đăng nhập để chat!');
            window.location.href = '/login';
            return;
        }

        fetch('/api/chat/start/' + postId)
            .then(response => {
                if (response.status === 401) {
                    alert('Phiên đăng nhập hết hạn, vui lòng đăng nhập lại!');
                    window.location.href = '/login';
                    return;
                }
                return response.json();
            })
            .then(convId => {
                if (convId) {
                    currentConvId = convId;
                    document.getElementById('activeConversationId').value = convId;
                    document.getElementById('chatWidget').style.display = 'block';
                    loadMessages(convId);
                }
            })
            .catch(err => console.error('Lỗi mở chat:', err));
    }

    function closeChat() {
        document.getElementById('chatWidget').style.display = 'none';
    }

    function loadMessages(convId) {
        fetch('/api/chat/messages/' + convId)
            .then(response => response.json())
            .then(messages => {
                const box = document.getElementById('chatMessages');
                box.innerHTML = '';
                messages.forEach(msg => {
                    appendMessageToUI(msg);
                });
                box.scrollTop = box.scrollHeight;
            });
    }

    function sendChatMessage(event) {
        event.preventDefault();
        const content = document.getElementById('chatInput').value.trim();
        if (!content || !currentConvId) return;

        const formData = new URLSearchParams();
        formData.append('conversationId', currentConvId);
        formData.append('content', content);

        fetch('/api/chat/send', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData
        })
        .then(response => response.json())
        .then(newMsg => {
            appendMessageToUI(newMsg);
            document.getElementById('chatInput').value = '';
            const box = document.getElementById('chatMessages');
            box.scrollTop = box.scrollHeight;
        });
    }

    function appendMessageToUI(msg) {
        const box = document.getElementById('chatMessages');
        const isMine = msg.sender.id === currentUserId;
        
        const div = document.createElement('div');
        div.className = isMine ? 'text-end mb-2' : 'text-start mb-2';
        
        div.innerHTML = `
            <div style="display: inline-block; padding: 8px 12px; border-radius: 10px; max-width: 80%; text-align: left; 
                        background-color: ${isMine ? '#0d6efd' : '#e9ecef'}; 
                        color: ${isMine ? '#ffffff' : '#000000'};">
                <p class="mb-0 small">${msg.content}</p>
            </div>
        `;
        box.appendChild(div);
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
