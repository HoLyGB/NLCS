<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý người dùng - Chợ Nhanh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar { min-height: 100vh; background-color: #212529; }
        .sidebar .nav-link { color: #cbd5e1; padding: 12px 20px; margin-bottom: 5px; border-radius: 8px; transition: 0.3s; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: white; background-color: #0d6efd; }
    </style>
</head>

<body class="bg-light">
<div class="container-fluid">
    <div class="row">
        <!-- SIDEBAR -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar px-3">
            <div class="position-sticky pt-4">
                <h4 class="text-white text-center pb-3 border-bottom border-secondary">⚡ Chợ Nhanh Admin</h4>
                <ul class="nav flex-column mt-4">
                    <li class="nav-item"><a class="nav-link" href="/admin/dashboard"><i class="fas fa-chart-pie me-2"></i> Tổng quan</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/admin/users"><i class="fas fa-users me-2"></i> Quản lý Người dùng</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/posts"><i class="fas fa-newspaper me-2"></i> Quản lý Bài viết</a></li>
                    <li class="nav-item"><a class="nav-link" href="/admin/categories"><i class="fas fa-list me-2"></i> Quản lý Danh mục</a></li>
                </ul>
            </div>
        </nav>

        <!-- MAIN CONTENT -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-4">
            <div class="d-flex justify-content-between mb-4">
                <h2>Danh sách Người dùng</h2>
            </div>

            <!-- THANH TÌM KIẾM -->
            <form th:action="@{/admin/users}" method="get" class="d-flex mb-3">
                <input type="text" name="search" th:value="${search}" class="form-control me-2" placeholder="Tìm theo tên..." style="max-width: 300px;">
                <button type="submit" class="btn btn-outline-primary"><i class="fas fa-search"></i> Tìm kiếm</button>
                <a href="/admin/users" class="btn btn-outline-secondary ms-2">Hủy</a>
            </form>

            <div class="table-responsive bg-white p-3 rounded shadow-sm border">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th><th>Họ tên</th><th>Số điện thoại</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}">1</td>
                            <td th:text="${user.fullName}">Dương Gia Bảo</td>
                            <td th:text="${user.phone}">0947268364</td>
                            <td th:text="${user.email}">baodg@example.com</td>
                            <td><span class="badge bg-dark" th:text="${user.role}">USER</span></td>
                            <td>
                                <span th:if="${user.isActive}" class="badge bg-success">Hoạt động</span>
                                <span th:unless="${user.isActive}" class="badge bg-danger">Khóa</span>
                            </td>
                            <td>
                                <button class="btn btn-sm btn-outline-warning" 
                                        th:data-id="${user.id}" th:data-name="${user.fullName}" th:data-email="${user.email}" 
                                        th:data-phone="${user.phone}" th:data-active="${user.isActive}" th:data-role="${user.role}"
                                        onclick="openEditModal(this)"><i class="fas fa-edit"></i></button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- PHÂN TRANG -->
            <nav aria-label="Page navigation" class="mt-3" th:if="${totalPages != null && totalPages > 0}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/users(page=${currentPage > 0 ? currentPage - 1 : 0}, search=${search})}">Trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" 
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/admin/users(page=${i}, search=${search})}" th:text="${i+1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/users(page=${currentPage < totalPages - 1 ? currentPage + 1 : totalPages - 1}, search=${search})}">Sau</a>
                    </li>
                </ul>
            </nav>
        </main>
    </div>
</div>

<!-- MODAL SỬA NGƯỜI DÙNG -->
<div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="editModalLabel">Sửa thông tin người dùng</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editUserId">
                <div class="mb-3">
                    <label class="form-label">Họ tên</label>
                    <input type="text" id="editFullName" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="text" id="editEmail" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" id="editPhone" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label">Trạng thái</label>
                    <select id="editIsActive" class="form-select">
                        <option value="true">Hoạt động</option>
                        <option value="false">Khóa</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Vai trò</label>
                    <select id="editRole" class="form-select">
                        <option value="user">User</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                <button type="button" class="btn btn-primary" onclick="saveUser()">Lưu thay đổi</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function openEditModal(button) {
    document.getElementById('editUserId').value = button.getAttribute('data-id');
    document.getElementById('editFullName').value = button.getAttribute('data-name');
    document.getElementById('editEmail').value = button.getAttribute('data-email');
    document.getElementById('editPhone').value = button.getAttribute('data-phone');
    document.getElementById('editIsActive').value = button.getAttribute('data-active');
    document.getElementById('editRole').value = button.getAttribute('data-role');

    new bootstrap.Modal(document.getElementById('editModal')).show();
}

function saveUser() {
    const id = document.getElementById('editUserId').value;
    const userData = {
        fullName: document.getElementById('editFullName').value,
        email: document.getElementById('editEmail').value,
        phone: document.getElementById('editPhone').value,
        isActive: document.getElementById('editIsActive').value === 'true',
        role: document.getElementById('editRole').value
    };

    fetch('/api/admin/users/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(userData)
    })
    .then(res => res.ok ? location.reload() : alert("Lỗi cập nhật!"));
}
</script>
</body>
</html>
