<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tin đã lưu - Chợ Nhanh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 1. Thiết lập Flexbox cho trang để Footer luôn bám đáy */
        html, body {
            height: 100%;
            margin: 0;
        }
        body {
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* 2. Phần nội dung chính sẽ tự giãn nở để đẩy footer xuống */
        .content-wrapper {
            flex: 1;
        }

        .navbar-chonhanh { background-color: #0d6efd; }
        .nav-item.dropdown:hover .dropdown-menu { display: block; margin-top: 0; }
        .post-card { transition: 0.2s; }
        .post-card:hover { transform: translateY(-3px); box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important; }
    </style>
</head>
<body>

<!-- Nhúng thanh Navbar chung -->
<div th:replace="navbar :: myNavbar"></div>

<!-- BỌC TOÀN BỘ NỘI DUNG VÀO ĐÂY ĐỂ ĐẨY FOOTER XUỐNG ĐÁY -->
<div class="content-wrapper">
    <div class="container my-5">
        <div class="d-flex align-items-center mb-4">
            <h2 class="fw-bold text-primary mb-0"><i class="fas fa-heart me-2"></i> Tin đăng đã lưu</h2>
            <span class="badge bg-secondary ms-3" th:text="${savedPosts != null ? savedPosts.size() + ' tin' : '0 tin'}">0 tin</span>
        </div>

        <!-- Danh sách tin đã lưu dạng lưới (Grid) -->
        <div class="row" th:if="${savedPosts != null and !savedPosts.isEmpty()}">
            <div class="col-md-4 mb-4" th:each="post : ${savedPosts}">
                <div class="card h-100 shadow-sm post-card">
                    <img th:src="${post.images != null and !post.images.isEmpty() ? post.images[0].imageUrl : '/images/default-product.png'}" 
                         class="card-img-top" alt="Product Image" style="height: 200px; object-fit: cover;">
                    
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title text-truncate" th:text="${post.title}">Tiêu đề bài đăng</h5>
                        <p class="text-danger fw-bold fs-5 mb-2" th:text="${post.price != null ? #numbers.formatDecimal(post.price, 0, 'COMMA', 0, 'POINT') + ' đ' : '0 đ'}">0 đ</p>
                        <p class="text-muted small mb-3"><i class="fas fa-map-marker-alt me-1"></i> <span th:text="${post.province}">Tỉnh/Thành</span></p>
                        
                        <div class="mt-auto d-flex justify-content-between align-items-center">
                            <a th:href="@{'/post/' + ${post.id}}" class="btn btn-outline-primary btn-sm">
                                <i class="fas fa-eye me-1"></i> Xem chi tiết
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Trường hợp chưa có tin nào được lưu -->
        <div class="text-center py-5 bg-white rounded shadow-sm border" th:if="${savedPosts == null or savedPosts.isEmpty()}">
            <i class="fas fa-heart-broken fa-3x text-muted mb-3"></i>
            <h5 class="text-muted">Bạn chưa lưu tin đăng nào cả.</h5>
            <p class="text-secondary small">Hãy khám phá các sản phẩm và nhấn biểu tượng lưu tin nhé!</p>
            <a th:href="@{/}" class="btn btn-primary mt-2"><i class="fas fa-store me-1"></i> Khám phá ngay</a>
        </div>
    </div>
</div>

<!-- FOOTER SẼ LUÔN NẰM Ở ĐÁY MÀN HÌNH -->
<footer class="bg-dark text-white text-center py-4 mt-auto">
    <p class="mb-0">© 2026 Chợ Nhanh - Nền tảng rao vặt trực tuyến</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
