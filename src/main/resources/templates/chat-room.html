<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Chat - Chợ Nhanh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .chat-box { height: 400px; overflow-y: scroll; border: 1px solid #ddd; padding: 15px; border-radius: 10px; background: #fff; }
        .msg-mine { text-align: right; margin-bottom: 10px; }
        .msg-mine span { background: #0d6efd; color: white; padding: 8px 15px; border-radius: 15px; display: inline-block; }
        .msg-other { text-align: left; margin-bottom: 10px; }
        .msg-other span { background: #e9ecef; color: black; padding: 8px 15px; border-radius: 15px; display: inline-block; }
    </style>
</head>
<body class="bg-light py-5">
    <div class="container col-md-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Chat về tin: <span th:text="${conversation.post.title}"></span></h5>
            </div>
            
            <div class="chat-box">
    <div th:each="msg : ${messages}" 
         th:class="${msg.sender.id == currentUserId ? 'd-flex justify-content-end' : 'd-flex justify-content-start'}">
        
        <!-- Tin nhắn của mình (căn phải, màu xanh) -->
        <div th:if="${msg.sender.id == currentUserId}" class="bg-primary text-white p-2 rounded mb-2" style="max-width: 70%;">
            <p class="mb-0" th:text="${msg.content}"></p>
        </div>

        <!-- Tin nhắn của đối phương (căn trái, màu xám) -->
        <div th:if="${msg.sender.id != currentUserId}" class="bg-light border p-2 rounded mb-2" style="max-width: 70%;">
            <p class="mb-0" th:text="${msg.content}"></p>
        </div>
    </div>
</div>

            <div class="card-footer">
                <form th:action="@{/chat/send}" method="POST" class="d-flex">
                    <input type="hidden" name="conversationId" th:value="${conversation.id}">
                    <input type="text" name="content" class="form-control me-2" placeholder="Nhập tin nhắn..." required>
                    <button type="submit" class="btn btn-primary">Gửi</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
