<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tin nhắn của tôi - Chợ Nhanh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f8f9fa; }
        .list-group-item { transition: all 0.2s; }
        .list-group-item:hover { background-color: #f1f3f5; }
        /* Style riêng cho hội thoại có tin nhắn chưa đọc */
        .unread-chat { background-color: #e8f0fe !important; border-left: 4px solid #0d6efd !important; }
    </style>
</head>
<body>

    <div th:replace="navbar :: myNavbar"></div>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <h4 class="fw-bold mb-4"><i class="fas fa-envelope text-primary me-2"></i> Hộp thư của tôi</h4>
                
                <div class="list-group list-group-flush" th:if="${not #lists.isEmpty(conversations)}">
                    <!-- Duyệt qua các cuộc hội thoại (đã tự động xếp tin mới lên đầu) -->
                    <a th:each="conv : ${conversations}" 
                       th:href="@{'/chat/room/' + ${conv.id}}" 
                       class="list-group-item list-group-item-action d-flex align-items-center py-3 border-bottom rounded-3 mb-2"
                       th:classappend="${@chatService.hasUnread(conv.id, currentUserId)} ? 'unread-chat' : 'bg-white'">
                        
                        <!-- Ảnh sản phẩm -->
                        <img th:src="${conv.post.images != null and !conv.post.images.isEmpty() ? conv.post.images[0].imageUrl : '/images/default-product.png'}" 
                             class="rounded me-3 shadow-sm" style="width: 65px; height: 65px; object-fit: cover;">
                        
                        <div class="flex-grow-1">
                            <div class="d-flex justify-content-between align-items-center">
                                <h6 class="mb-1 text-dark" 
                                    th:classappend="${@chatService.hasUnread(conv.id, currentUserId)} ? 'fw-bold text-primary' : 'fw-semibold'"
                                    th:text="${conv.post.title}">Tiêu đề bài đăng</h6>
                                    
                                <!-- Huy hiệu thông báo chưa đọc -->
                                <span th:if="${@chatService.hasUnread(conv.id, currentUserId)}" class="badge bg-danger rounded-pill">Mới</span>
                            </div>
                            
                            <p class="mb-0 text-muted small">
                                Chat với: 
                                <span class="fw-semibold" 
                                      th:text="${conv.buyer.id == currentUserId ? conv.seller.fullName : conv.buyer.fullName}">
                                    Tên người trò chuyện
                                </span>
                            </p>
                        </div>
                        <i class="fas fa-chevron-right text-secondary ms-3"></i>
                    </a>
                </div>

                <!-- Trường hợp trống -->
                <div class="text-center py-5" th:if="${#lists.isEmpty(conversations)}">
                    <i class="fas fa-comment-slash fa-3x text-muted mb-3"></i>
                    <h5 class="text-muted">Chưa có tin nhắn nào</h5>
                    <p class="text-muted small">Hãy liên hệ người bán để bắt đầu trò chuyện!</p>
                    <a href="/" class="btn btn-outline-primary mt-2">Về trang chủ</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
