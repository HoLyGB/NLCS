<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - Chợ Nhanh</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            /* Hình nền toàn màn hình chủ đề thương mại/mua sắm */
            background-image: url('https://images.unsplash.com/photo-1472851294608-062f824d29cc?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
        }

        /* Lớp phủ màu tối nhẹ để làm mờ nền, giúp form nổi bật hơn */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
        }

        .container {
            position: relative;
            z-index: 1;
        }

        .card {
            border: none;
            border-radius: 1rem;
            /* Hiệu ứng kính mờ cho card sang trọng */
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.95);
        }

        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            background-color: #f8f9fa;
        }

        .form-control:focus {
            background-color: #fff;
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }

        .btn-success {
            padding: 0.75rem;
            font-weight: 600;
            border-radius: 0.5rem;
            background: linear-gradient(135deg, #198754 0%, #157347 100%);
            border: none;
            transition: all 0.3s ease;
        }

        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(25, 135, 84, 0.3);
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        
                        <!-- Tiêu đề -->
                        <div class="text-center mb-4">
                            <div class="text-success mb-2">
                                <i class="fas fa-user-plus fa-2x"></i>
                            </div>
                            <h3 class="fw-bold text-dark">Tạo Tài Khoản Mới</h3>
                            <p class="text-muted small">Đăng ký để trải nghiệm mua bán nhanh chóng</p>
                        </div>
                        
                        <!-- Thông báo lỗi (nếu có) -->
                        <div th:if="${errorMsg}" class="alert alert-danger alert-dismissible fade show text-center py-2" role="alert">
                            <i class="fas fa-exclamation-circle me-1"></i> <span th:text="${errorMsg}"></span>
                            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>

                        <!-- Form Đăng Ký -->
                        <form action="/dangky" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Họ và Tên</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 shadow-none" name="fullName" placeholder="Nhập họ tên của bạn..." required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Số điện thoại</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-phone"></i></span>
                                    <input type="text" class="form-control border-start-0 ps-0 shadow-none" name="phone" placeholder="Nhập số điện thoại..." required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Email <span class="text-muted fw-normal">(Tùy chọn)</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control border-start-0 ps-0 shadow-none" name="email" placeholder="Nhập email...">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold small text-secondary">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control border-start-0 ps-0 shadow-none" name="password" placeholder="Tạo mật khẩu..." required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold small text-secondary">Xác nhận mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fas fa-lock"></i></span>
                                    <input type="password" class="form-control border-start-0 ps-0 shadow-none" name="confirmPassword" placeholder="Nhập lại mật khẩu..." required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100 shadow-sm">Đăng Ký Ngay</button>
                        </form>
                        
                        <!-- Chuyển hướng đăng nhập -->
                        <div class="text-center mt-4 pt-3 border-top">
                            <span class="text-muted small">Đã có tài khoản? </span>
                            <a href="/dangnhap" class="text-decoration-none fw-semibold text-success">Đăng nhập ngay</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
